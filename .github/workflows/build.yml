name: Build

# Every push: run the tests, then build the linux/amd64 Docker image.
# Pushes to main (and v1.2.3 tags) also publish it to ghcr.io/<owner>/culury.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: culury
          POSTGRES_PASSWORD: culury
          POSTGRES_DB: culury_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U culury" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://culury:culury@localhost:5432/culury_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: "API: install, typecheck, test"
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: "Web app: install and build"
        working-directory: frontend
        run: |
          npm ci
          npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/culury
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - name: Sign in to GitHub's container registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build linux/amd64 (and publish from main / version tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
